[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "simple-harness-sdk"
dynamic = ["version"]
description = "Embeddable durable agent runtime and workflow SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [
  { name = "DennyWanye" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27,<1",
  # 任务的 `file:` / `pytest:` 要求都由沙箱里的 pytest 核对，宿主解释器必须装它
  "pytest>=8.3,<9",
]

[project.optional-dependencies]
planning-aries = ["unified-planning[aries]>=1.2,<2"]
local-capacity = ["psutil>=7.2.2,<8"]
deepseek-tokenizer = ["deepseek-recipe==0.1.1"]
hf-tokenizer = ["transformers>=4.57,<6", "tokenizers>=0.22,<1", "jinja2>=3.1,<4"]
skill-import = [
    "pyyaml>=6.0,<7",
]

[project.entry-points.pytest11]
simple_harness = "simple_harness.testing.pytest_plugin"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-anyio>=0.0.0",
  "reuse>=5.0,<6",
  "twine>=6.1,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simple_harness", "src/agent_orchestrator"]
core-metadata-version = "2.4"

[tool.hatch.version]
path = "src/simple_harness/version.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/.github",
  "/CHANGELOG.md",
  "/docs",
  "/LICENSES",
  "/NOTICE",
  "/README.md",
  "/REUSE.toml",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/source-manifest.tsv",
  "/tests",
  "/uv.lock",
]
exclude = [
  "/.git",
  "/.local-test-evidence",
  "/.pytest_cache",
  "/.venv*",
  "/build",
  "/dist",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "h7_runtime_gate: frozen H7 Provider ReAct Tool restart and child runtime seams",
  "h7_workflow_terminal_gate: frozen H7 strict and legacy workflow terminal projection seams",
  "anyio: async tests using anyio",
  "simple_harness_conformance: mark test as requiring conformance host fixture",
  "real_provider: end-to-end test that calls a real LLM provider (opt in with --run-real-provider)",
  "real_embedding: test that needs a real embedding model (opt in with --run-real-embedding)",
  "replay_audit_exempt(reason): the test damages or writes the library outside the product path on purpose; the v3 audit records it as exempt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
# 产品只做 macOS（2026-10-04 用户定）；沙箱执行器在非 macOS 上构造即拒，按别的平台检查会把
# 其后代码当成执行不到。固定按 macOS 检查，CI（Linux）与本机结果一致（计划 2.12 修订）。
platform = "darwin"
# 代码质量整治 5E：范围是 SDK 全部源码（豁免见下面的 overrides）。
files = [
  "src",
  "tests/conformance/future_consumer_fixture.py",
  "tests/typing/agent_memory_port.py",
  "tests/typing/human_memory_protocol.py",
]

# 代码质量整治 5E（阶段5-偏差单-类型清零.md 裁决）：
# 表结构文件是禁区，字节不变，不为类型注解破例；只豁免这两个完整模块。
[[tool.mypy.overrides]]
module = [
  "simple_harness.execution.sqlite.audit_schema",
  "simple_harness.execution.sqlite.stage_audit_schema",
]
ignore_errors = true

# 可选依赖：只在安装了对应附加包时才导入，没有类型存根。
[[tool.mypy.overrides]]
module = ["yaml", "unified_planning.*", "deepseek_recipe", "tiktoken"]
ignore_missing_imports = true

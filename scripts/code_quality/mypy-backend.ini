# 代码质量整治：后端 mypy 配置（计划 0.7）。先报告不阻断，错误数进棘轮。
# 用法：sdk/simple-harness-sdk/.venv/bin/mypy --config-file scripts/code_quality/mypy-backend.ini
[mypy]
python_version = 3.12
python_executable = backend/.venv/bin/python
mypy_path = backend
files = backend/deskpet, backend/agent, backend/llm, backend/providers, backend/memory,
        backend/tools, backend/observability, backend/router, backend/billing, backend/pipeline,
        backend/main.py, backend/config.py, backend/context.py, backend/paths.py
exclude = (^|/)(tests|vendor|dist[^/]*|build|userdata|\.venv|templates)/
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
check_untyped_defs = False
cache_dir = backend/.mypy_cache

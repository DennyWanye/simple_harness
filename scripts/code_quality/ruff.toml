# 代码质量整治：后端与 SDK 共用的一份 ruff 规则（计划 0.7）。
# 用法：ruff check --config scripts/code_quality/ruff.toml <路径>
# 旧代码走棘轮（scripts/code_quality/metrics.py check），新建文件直接阻断（计划 0.12）。
line-length = 100
target-version = "py311"
extend-exclude = [
  "**/vendor/**", "**/dist/**", "**/dist-1/**", "**/build/**", "**/userdata/**",
  "**/.venv/**", "**/*.egg-info/**", "**/node_modules/**",
  # 禁区：表结构与迁移（字节不许变）
  "**/schema.py", "**/migrator.py", "**/migration.py", "**/*_migration.py", "**/migrations/**",
  "**/schema_migrations.py",
  # 阶段 8 裁决：带建表语句或按 SQL 文本哈希核对身份的模块（与 guard.py 的 FORBIDDEN_PY 一致）
  "backend/deskpet/memory/*_schema.py", "backend/deskpet/memory/schema_chain.py",
  "backend/deskpet/memory/schema_v2_migrator.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/storage/*_schema.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/governance/*_schema.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/runtime/*_schema.py",
  "sdk/simple-harness-sdk/src/simple_harness/execution/sqlite/*_schema.py",
  # 发布给用户的能力包模板（已发布模板文字是执行池准入身份）
  "**/capabilities/templates/**",
  # 编解码器清单写死了这些源文件的字节哈希（network_codec_manifest_v5.json），改字节即拒绝解码
  "sdk/simple-harness-sdk/src/agent_orchestrator/contracts/evidence_state.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/contracts/htn.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/contracts/models.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/contracts/semantic_base.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/contracts/state_machines.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/graph/network_codec.py",
  "sdk/simple-harness-sdk/src/agent_orchestrator/graph/task_network.py",
  "sdk/simple-harness-sdk/src/simple_harness/contracts/__init__.py",
  "sdk/simple-harness-sdk/src/simple_harness/contracts/errors.py",
  "sdk/simple-harness-sdk/src/simple_harness/contracts/json.py",
  # 测试按字节冻结的起始快照文件（tests/agents/test_api_mode_fence.py FROZEN_FILES）
  "sdk/simple-harness-sdk/src/simple_harness/runtime/start_snapshot.py",
  "sdk/simple-harness-sdk/src/simple_harness/runtime/drivers/start_mode.py",
  # 测试数据文件
  "**/fixtures/**", "**/testdata/**",
]

[lint]
select = [
  "E", "F", "W",      # 基础错误与风格
  "I",                # 导入排序
  "UP",               # 新语法
  "B",                # 常见陷阱
  "N",                # 命名
  "SIM",              # 可简化写法
  "C4",               # 推导式
  "PIE", "RET",       # 多余写法、返回值
  "BLE001",           # 捕获所有异常
  "C90",              # 圈复杂度
  "PLR0912",          # 分支过多
  "PLR0915",          # 语句过多
]

ignore = [
  "N818",   # 异常类名不强制 Error 后缀（SDK 公开异常改名会波及调用方）
  "C408",   # dict()/list() 调用属个人偏好
]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-branches = 15
max-statements = 60

[lint.per-file-ignores]
# 测试允许长函数、断言风格与宽异常
"**/tests/**" = ["C90", "PLR0912", "PLR0915", "BLE001", "N802", "N806"]

# 阶段 1 起：格式化与自动修复都不碰禁区与数据文件
[format]
quote-style = "double"
line-ending = "lf"

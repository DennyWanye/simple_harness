[features]
context_os_v1 = true

[context]
effective_model_window = 8192

[context.compaction]
model = "follow_session"

# Context OS coverage/page-in cases must not depend on host-specific skill
# embeddings.  Product defaults remain ON; this isolated fixture removes an
# unrelated semantic auto-load that would make the 8K oracle nondeterministic.
[skills.auto_disclosure]
enabled = false

